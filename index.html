<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laketos Wi-Fi Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .box {
      background: #ffffff;
      padding: 30px;
      width: 320px;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    h2 {
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    .msg {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Welcome to Laketos Wi-Fi</h2>
    <p>Please enter the access code provided to you.</p>

    <input type="password" id="code" placeholder="Enter access code">
    <button onclick="checkCode()">Connect</button>

    <div class="msg" id="message"></div>
  </div>

  <script>
    function checkCode() {
      var correctCode = "LAKETOS123";   // 🔑 CHANGE YOUR CODE HERE
      var userCode = document.getElementById("code").value;
      var msg = document.getElementById("message");

      if (userCode === correctCode) {
        msg.style.color = "green";
        msg.innerHTML = "✅ Access granted. You may now use the internet.";
      } else {
        msg.style.color = "red";
        msg.innerHTML = "❌ Invalid code. Please try again.";
      }
    }
  </script>

</body>
</html>
